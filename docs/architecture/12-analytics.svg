<svg xmlns="http://www.w3.org/2000/svg" width="2218" height="671" viewBox="0 0 2218 671"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#65778a"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="35" y="35" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#172d40">Personal analytics / logical joins</text><text x="35" y="59" font-family="Arial,sans-serif" font-size="13" fill="#536574">Dashed arrows are computed joins, not FK constraints. Current days are provisional. IRF retains its</text><text x="35" y="76" font-family="Arial,sans-serif" font-size="13" fill="#536574">estimated-duration formula. No causal claim is implied.</text><polyline points="385,539.5 477,539.5 569,539.5" fill="none" stroke="#9673a6" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="436" y="548.5" width="82" height="23" fill="white"/><text x="477" y="564.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526679">timestamps</text><polyline points="919,185 1070.2,185 1269.9142857142858,290" fill="none" stroke="#9673a6" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="970" y="194" width="200.4" height="23" fill="white"/><text x="1070.2" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526679">completion within interval</text><polyline points="919,356.5 1070.2,356.5 1221.4,356.5" fill="none" stroke="#9673a6" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="1018.1" y="365.5" width="104.2" height="23" fill="white"/><text x="1070.2" y="381.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526679">node_id match</text><polyline points="919,539.5 1070.2,539.5 1277.8628415300548,423" fill="none" stroke="#9673a6" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="1007" y="548.5" width="126.4" height="23" fill="white"/><text x="1070.2" y="564.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526679">bounded interval</text><polyline points="1571.4,356.5 1681.9,356.5 1792.4,356.5" fill="none" stroke="#9673a6" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="1622.4" y="365.5" width="119" height="23" fill="white"/><text x="1681.9" y="381.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526679">derived results</text><a href="https://github.com/xorca0711/Mycelium_OS_Opt/blob/main/O_neash%20Dash/src/plugins/AnalyticsPlugin/panels/planner-sleep/sleepWindowData.ts" target="_blank"><rect x="35" y="484.5" width="350" height="110" rx="9" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.6"/><text x="49" y="512.5" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#18334d">Sleep history</text><text x="49" y="542.5" font-family="Arial,sans-serif" font-size="14" fill="#334b60">sleep_entries: wake_time, sleep_start</text><text x="49" y="565.5" font-family="Arial,sans-serif" font-size="14" fill="#334b60">Non-nap records in calendar window</text></a><a href="https://github.com/xorca0711/Mycelium_OS_Opt/blob/main/O_neash%20Dash/src/plugins/PlannerPlugin/lib/plannerDb.ts" target="_blank"><rect x="569" y="130" width="350" height="110" rx="9" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.6"/><text x="583" y="158" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#18334d">Completed planner tasks</text><text x="583" y="188" font-family="Arial,sans-serif" font-size="14" fill="#334b60">nodes: actual_completed_at, arc_id</text><text x="583" y="211" font-family="Arial,sans-serif" font-size="14" fill="#334b60">Events excluded; future tasks excluded</text></a><a href="https://github.com/xorca0711/Mycelium_OS_Opt/blob/main/O_neash%20Dash/src/plugins/PlannerPlugin/lib/onTheClockDb.ts" target="_blank"><rect x="569" y="290" width="350" height="133" rx="9" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.6"/><text x="583" y="318" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#18334d">Tracked effort</text><text x="583" y="348" font-family="Arial,sans-serif" font-size="14" fill="#334b60">session_nodes: node_id, total_minutes</text><text x="583" y="371" font-family="Arial,sans-serif" font-size="14" fill="#334b60">SUM across task sessions, including</text><text x="583" y="394" font-family="Arial,sans-serif" font-size="14" fill="#334b60">effort from incomplete attempts</text></a><a href="https://github.com/xorca0711/Mycelium_OS_Opt/blob/main/O_neash%20Dash/src/plugins/AnalyticsPlugin/panels/planner-sleep/sleepWindows.ts" target="_blank"><rect x="569" y="473" width="350" height="133" rx="9" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.6"/><text x="583" y="501" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#18334d">Bounded waking window</text><text x="583" y="531" font-family="Arial,sans-serif" font-size="14" fill="#334b60">Local wake date; same cutoff as tasks</text><text x="583" y="554" font-family="Arial,sans-serif" font-size="14" fill="#334b60">[wake, min(next sleep, now, wake+20h))</text><text x="583" y="577" font-family="Arial,sans-serif" font-size="14" fill="#334b60">Missing-night gaps stay unassigned</text></a><a href="https://github.com/xorca0711/Mycelium_OS_Opt/blob/main/O_neash%20Dash/src/plugins/AnalyticsPlugin/panels/planner-sleep/clusterMath.ts" target="_blank"><rect x="1221.4" y="290" width="350" height="133" rx="9" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.6"/><text x="1235.4" y="318" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#18334d">Daily output / feature rows</text><text x="1235.4" y="348" font-family="Arial,sans-serif" font-size="14" fill="#334b60">Task count + duration in same interval</text><text x="1235.4" y="371" font-family="Arial,sans-serif" font-size="14" fill="#334b60">CPS = sqrt(count x minutes) / hours</text><text x="1235.4" y="394" font-family="Arial,sans-serif" font-size="14" fill="#334b60">Arc counts + sleep features</text></a><a href="https://github.com/xorca0711/Mycelium_OS_Opt/blob/main/O_neash%20Dash/src/plugins/AnalyticsPlugin/panels/planner-sleep/PlannerSleepPanel.tsx" target="_blank"><rect x="1792.4" y="290" width="350" height="133" rx="9" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.6"/><text x="1806.4" y="318" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#18334d">Analytics views</text><text x="1806.4" y="348" font-family="Arial,sans-serif" font-size="14" fill="#334b60">Sleep/output scatter and regression</text><text x="1806.4" y="371" font-family="Arial,sans-serif" font-size="14" fill="#334b60">Behavior clusters + recurrence</text><text x="1806.4" y="394" font-family="Arial,sans-serif" font-size="14" fill="#334b60">IRF: D+n uses local calendar dates</text></a></svg>