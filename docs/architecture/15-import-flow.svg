679">Import reviewed notes</text><polyline points="410,1035 410,1101 410,1167" fill="none" stroke="#65778a" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="416" y="1089" width="133.8" height="23" fill="white"/><text x="482.9" y="1105" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526679">fresh local check</text><polyline points="410,1300 410,1366 410,1432" fill="none" stroke="#65778a" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="416" y="1354" width="104.2" height="23" fill="white"/><text x="468.1" y="1370" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526679">atomic writes</text><a href="https://github.com/xorca0711/Mycelium_OS_Opt/blob/main/O_neash%20Dash/src/lib/imports/notionClient.ts" target="_blank"><rect x="35" y="130" width="350" height="133" rx="9" fill="#f5f5f5" stroke="#8b949e" stroke-width="1.6"/><text x="49" y="158" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#18334d">Selected Notion source</text><text x="49" y="188" font-family="Arial,sans-serif" font-size="14" fill="#334b60">Page / database / data source</text><text x="49" y="211" font-family="Arial,sans-serif" font-size="14" fill="#334b60">Token in memory; no startup fetch</text><text x="49" y="234" font-family="Arial,sans-serif" font-size="14" fill="#334b60">Read-only remote API; bounded preview</text></a><a href="https://github.com/xorca0711/Mycelium_OS_Opt/blob/main/O_neash%20Dash/src/lib/imports/files.ts" target="_blank"><rect x="435" y="130" width="350" height="133" rx="9" fill="#f5f5f5" stroke="#8b949e" stroke-width="1.6"/><text x="449" y="158" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#18334d">Selected CSV / JSON</text><text x="449" y="188" font-family="Arial,sans-serif" font-size="14" fill="#334b60">Local file up to 10 MiB</text><text x="449" y="211" font-family="Arial,sans-serif" font-size="14" fill="#334b60">Stable source label + ID/title/text fields</text><text x=