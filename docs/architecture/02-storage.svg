<svg xmlns="http://www.w3.org/2000/svg" width="2159" height="717" viewBox="0 0 2159 717"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#65778a"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="35" y="35" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#172d40">Storage boundaries / personal inputs</text><text x="35" y="59" font-family="Arial,sans-serif" font-size="13" fill="#536574">One data file per environment, not one database per plugin. SQLite + media + WebView preferences are distinct</text><text x="35" y="76" font-family="Arial,sans-serif" font-size="13" fill="#536574">storage surfaces.</text><polyline points="1440.9480719794344,336 1626.3999999999999,208 1733.1999999999998,208" fill="none" stroke="#65778a" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="1570.6" y="217" width="111.60000000000001" height="23" fill="white"/><text x="1626.3999999999999" y="233" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526679">domain records</text><polyline points="1519.6,402.5 1626.3999999999999,402.5 1733.1999999999998,402.5" fill="none" stroke="#65778a" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="1600.1999999999998" y="411.5" width="52.400000000000006" height="23" fill="white"/><text x="1626.3999999999999" y="427.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526679">images</text><polyline points="1447.0027322404371,469 1626.3999999999999,585.5 1733.1999999999998,585.5" fill="none" stroke="#65778a" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="1581.6999999999998" y="594.5" width="89.4" height="23" fill="white"/><text x="1626.3999999999999" y="610.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526679">preferences</text><polyline points="385,402.5 491.8,402.5 598.6,402.5" fill="none" stroke="#65778a" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="436" y="411.5" width="111.60000000000001" height="23" fill="white"/><text x="491.8" y="427.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526679">feed responses</text><polyline points="948.6,402.5 1059.1,402.5 1169.6,402.5" fill="none" stroke="#65778a" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="999.5999999999999" y="411.5" width="119" height="23" fill="white"/><text x="1059.1" y="427.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526679">cached articles</text><a href="https://github.com/xorca0711/Mycelium_OS_Opt/blob/codex/local-setup/O_neash%20Dash/src-tauri/src/database/mod.rs" target="_blank"><rect x="1733.1999999999998" y="130" width="350" height="156" rx="9" fill="#fff2cc" stroke="#d6b656" stroke-width="1.6"/><text x="1747.1999999999998" y="158" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#18334d">Primary SQLite data</text><text x="1747.1999999999998" y="188" font-family="Arial,sans-serif" font-size="14" fill="#334b60">Debug: Documents/O-neash-data-dev/</text><text x="1747.1999999999998" y="211" font-family="Arial,sans-serif" font-size="14" fill="#334b60">Release: Documents/O-neash-data/</text><text x="1747.1999999999998" y="234" font-family="Arial,sans-serif" font-size="14" fill="#334b60">Both: oneash-DB.db</text><text x="1747.1999999999998" y="257" font-family="Arial,sans-serif" font-size="14" fill="#334b60">No personal database read for this map</text></a><a href="https://github.com/xorca0711/Mycelium_OS_Opt/blob/codex/local-setup/O_neash%20Dash/src/lib/dataLocation.ts" target="_blank"><rect x="1733.1999999999998" y="336" width="350" height="133" rx="9" fill="#fff2cc" stroke="#d6b656" stroke-width="1.6"/><text x="1747.1999999999998" y="364" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#18334d">Media files beside SQLite</text><text x="1747.1999999999998" y="394" font-family="Arial,sans-serif" font-size="14" fill="#334b60">notes-images/ and journal-images/</text><text x="1747.1999999999998" y="417" font-family="Arial,sans-serif" font-size="14" fill="#334b60">wardrobe-images/ and filmneg-images/</text><text x="1747.1999999999998" y="440" font-family="Arial,sans-serif" font-size="14" fill="#334b60">DB stores paths / JSON references</text></a><a href="https://github.com/xorca0711/Mycelium_OS_Opt/blob/codex/local-setup/O_neash%20Dash/src/lib/fontSettings.ts" target="_blank"><rect x="1733.1999999999998" y="519" width="350" height="133" rx="9" fill="#fff2cc" stroke="#d6b656" stroke-width="1.6"/><text x="1747.1999999999998" y="547" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#18334d">WebView localStorage</text><text x="1747.1999999999998" y="577" font-family="Arial,sans-serif" font-size="14" fill="#334b60">Fonts; arc visibility; widget layout</text><text x="1747.1999999999998" y="600" font-family="Arial,sans-serif" font-size="14" fill="#334b60">Weather location; daily quote cache</text><text x="1747.1999999999998" y="623" font-family="Arial,sans-serif" font-size="14" fill="#334b60">Separate from SQLite backup</text></a><a href="https://github.com/xorca0711/Mycelium_OS_Opt/blob/codex/local-setup/O_neash%20Dash/src/widgets/lib/feedCache.ts" target="_blank"><rect x="598.6" y="336" width="350" height="133" rx="9" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.6"/><text x="612.6" y="364" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#18334d">Session memory</text><text x="612.6" y="394" font-family="Arial,sans-serif" font-size="14" fill="#334b60">Zustand state / note catalog</text><text x="612.6" y="417" font-family="Arial,sans-serif" font-size="14" fill="#334b60">Feed cache: 15m TTL, deduped fetches</text><text x="612.6" y="440" font-family="Arial,sans-serif" font-size="14" fill="#334b60">60s retry cooldown; stale fallback</text></a><a href="https://github.com/xorca0711/Mycelium_OS_Opt/blob/codex/local-setup/O_neash%20Dash/src/widgets/widgets/ResearchFeed.tsx" target="_blank"><rect x="35" y="336" width="350" height="133" rx="9" fill="#f5f5f5" stroke="#8b949e" stroke-width="1.6"/><text x="49" y="364" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#18334d">External sources</text><text x="49" y="394" font-family="Arial,sans-serif" font-size="14" fill="#334b60">HN / BBC / Yonhap / Nature / Cell</text><text x="49" y="417" font-family="Arial,sans-serif" font-size="14" fill="#334b60">Weather and quote APIs</text><text x="49" y="440" font-family="Arial,sans-serif" font-size="14" fill="#334b60">HTTP reads, distinct from personal DB</text></a><a href="https://github.com/xorca0711/Mycelium_OS_Opt/blob/codex/local-setup/O_neash%20Dash/src/plugins/registry.ts" target="_blank"><rect x="1169.6" y="336" width="350" height="133" rx="9" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.6"/><text x="1183.6" y="364" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#18334d">Personal workspace views</text><text x="1183.6" y="394" font-family="Arial,sans-serif" font-size="14" fill="#334b60">Planner, notes, sleep, habits, journal</text><text x="1183.6" y="417" font-family="Arial,sans-serif" font-size="14" fill="#334b60">Academic, wardrobe, film, analytics</text><text x="1183.6" y="440" font-family="Arial,sans-serif" font-size="14" fill="#334b60">User-entered records and media</text></a></svg>