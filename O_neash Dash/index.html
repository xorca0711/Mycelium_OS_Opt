<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/character/cyphel_teal_noeyes.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mycelium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=SUSE:wght@400;700&family=Gowun+Dodum&family=PT+Sans:ital,wght@0,400;0,700;1,400&family=Inconsolata:wght@400;700&family=IBM+Plex+Mono+KR:wght@400;700&display=swap" rel="stylesheet" />
      <style>
        @font-face {
          font-family: 'Odibee Sans';
          src: url('/fonts/OdibeeSans-Regular.ttf') format('truetype');
          font-weight: 400;
          font-style: normal;
          font-display: swap;
        }
        @font-face {
          font-family: 'KOTRAGothic';
          src: url('/fonts/KOTRA_GOTHIC.otf') format('opentype');
          font-weight: normal;
          font-style: normal;
        }

        #root { visibility: hidden; }
        #root.app-enter { visibility: visible; animation: app-reveal .6s cubic-bezier(.22,1,.36,1) backwards; }
        @keyframes app-reveal {
          from { opacity: 0; transform: translateY(10px) scale(.97); }
          to { opacity: 1; transform: none; }
        }
        #splash-screen.splash-exit { pointer-events: none; opacity: 0; transition: opacity .35s ease; }

        #splash-screen {
          position: fixed;
          inset: 0;
          background: #000;
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 9999;
        }
        .splash-inner {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 36px;
        }
        .splash-avatar {
          position: relative;
          width: 150px;
          height: 150px;
        }
        .splash-avatar img {
          width: 100%;
          height: 100%;
          display: block;
        }
        .splash-eye {
          position: absolute;
          width: 10px;
          height: 10px;
          border-radius: 50%;
          background: transparent;
          overflow: hidden;
        }
        .splash-eye::after {
          content: '';
          position: absolute;
          inset: 0;
          background: #fff;
          transform-origin: bottom;
          transform: scaleY(0);
          animation: splash-wake 6s linear forwards;
        }
        @keyframes splash-wake {
          0%, 6%   { transform: scaleY(0); }
          11%      { transform: scaleY(1); }
          72%      { transform: scaleY(1); }
          75%      { transform: scaleY(0); }
          79%      { transform: scaleY(1); }
          100%     { transform: scaleY(1); }
        }
        .splash-text-wrap {
          height: 1.4em;
          width: 320px;
          text-align: center;
          margin-top: -20px;
        }
        .splash-text {
          font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
          font-size: 0.82rem;
          color: rgba(255,255,255,0.45);
        }
        .splash-title {
          font-family: 'Odibee Sans', monospace;
          font-size: 5.5rem;
          color: #fff;
          margin: 0;
          line-height: 1;
        }
        .splash-bar-track {
          width: 320px;
          height: 2px;
          background: rgba(255,255,255,0.18);
          overflow: hidden;
        }
        .splash-bar-fill {
          height: 100%;
          background: rgba(255,255,255,0.65);
          width: 40%;
          animation: splash-load 1.2s ease-in-out infinite alternate;
        }
        @keyframes splash-load {
          from { transform: translateX(-100%); }
          to   { transform: translateX(250%); }
        }
        @media (prefers-reduced-motion: reduce) {
          #root.app-enter, .splash-eye::after, .splash-bar-fill { animation: none; }
          #splash-screen.splash-exit { transition: none; }
          .splash-eye::after { transform: scaleY(1); }
        }
      </style>
  </head>

  <body autocorrect="off" autocapitalize="off" spellcheck="false">
    <div id="splash-screen">
      <div class="splash-inner">
        <div class="splash-avatar">
          <img src="/icons/character/cyphel_teal_noeyes.png" alt="" />
          <div class="splash-eye" style="left:61px;top:75px;"></div>
          <div class="splash-eye" style="left:80px;top:75px;"></div>
        </div>
        <div class="splash-title">Mycelium</div>
        <div class="splash-bar-track">
          <div class="splash-bar-fill"></div>
        </div>
        <div class="splash-text-wrap">
          <span id="splash-msg" class="splash-text" role="status">Preparing Mycelium...</span>
        </div>
      </div>
    </div>
    <div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
  </body>
</html>
